<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout - Store</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <header>
        <a href="/" class="logo"><i class="fa-solid fa-bag-shopping"></i> Store</a>
        <div class="nav-icons"><a href="/cart"><i class="fa-solid fa-arrow-left"></i> Back to Cart</a></div>
    </header>
    <main class="container" style="max-width:800px;">
        <h2 style="font-size: 2rem; text-align: center; margin-bottom: 2rem;">Checkout</h2>
        <form method="POST" class="form-container" style="max-width: 100%;">
            <div class="form-group"><label>Full Name</label><input type="text" name="name" class="form-control" required></div>
            <div class="form-group"><label>Email Address (For Receipt)</label><input type="email" name="email" class="form-control" required></div>
            <div class="form-group"><label>Phone Number</label><input type="text" name="phone" class="form-control" required></div>
            <div class="form-group">
                <label>Country</label>
                <select name="country" class="form-control" required>
                    <option value="United States">United States</option>
                    <option value="Spain">Spain</option>
                    <option value="Mexico">Mexico</option>
                    <option value="Canada">Canada</option>
                    <option value="United Kingdom">United Kingdom</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group"><label>Shipping Address</label><textarea name="address" class="form-control" style="height:100px;" required></textarea></div>
            <div class="form-group">
                <label>Payment Method</label>
                <select name="payment_method" class="form-control">
                    <option value="cash_on_delivery">Cash on Delivery</option>
                    <option value="bank_transfer">Bank Transfer</option>
                </select>
            </div>
            <button type="submit" class="btn" style="font-size: 1.1rem; padding: 16px; margin-top: 1rem;">Confirm Order</button>
        </form>
    </main>
    {% include 'footer.html' %}
</body>
</html>
