<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer Login - Store</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="form-container" style="margin-top: 5rem;">
        <h2 style="text-align: center; margin-bottom: 2rem;">Customer Login</h2>
        
        {% if request.args.get('verified') %}
        <p style="color:green; text-align:center; margin-bottom:1rem;">Email verified successfully! You can now log in.</p>
        {% endif %}
        {% if error %}<p style="color:red; text-align:center;">{{ error }}</p>{% endif %}
        
        <form method="POST">
            <div class="form-group"><label>Email</label><input type="email" name="email" class="form-control" required></div>
            <div class="form-group"><label>Password</label><input type="password" name="password" class="form-control" required></div>
            <button type="submit" class="btn">Login</button>
        </form>
        <div style="text-align: center; margin-top: 1rem;">
            <a href="/forgot-password" style="font-size: 0.9rem; color: var(--accent);">Forgot Password?</a>
        </div>
        <p style="text-align:center; margin-top:1rem;">Don't have an account? <a href="/register">Register here</a></p>
        <p style="text-align:center; margin-top:0.5rem;"><a href="/">← Back to Store</a></p>
    </div>
</body>
</html>
