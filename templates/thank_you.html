<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed - Store</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <header><a href="/" class="logo"><i class="fa-solid fa-bag-shopping"></i> Store</a></header>
    <main class="container" style="text-align:center; padding-top: 6rem;">
        <div style="width: 80px; height: 80px; background: #dcfce7; color: #166534; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 2rem;">
            <i class="fa-solid fa-check fa-2x"></i>
        </div>
        <h1 style="font-size: 2.5rem; font-weight: 700; margin-bottom: 1rem;">Order Confirmed!</h1>
        <p style="font-size:1.2rem; color: var(--text-muted); margin-bottom: 2rem;">Thank you for your purchase. Your order number is <strong style="color: var(--text-main);">#{{ order_id }}</strong>.</p>
        <p style="color:var(--text-muted); margin-bottom: 3rem;">We will contact you shortly to arrange delivery.</p>
        <a href="/" class="btn" style="width:auto; padding: 14px 32px;">Return to Store</a>
    </main>
    {% include 'footer.html' %}
</body>
</html>
