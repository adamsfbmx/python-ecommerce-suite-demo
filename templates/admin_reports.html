<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Accounting Reports - Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <style>
        @media print {
            header, .btn { display: none !important; }
            body { background: white; padding: 0; }
            .container { margin: 0; max-width: 100%; }
            table { min-width: 100%; border: 1px solid #000; }
            th, td { border-bottom: 1px solid #000; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-top">
            <a href="/" class="logo">Store Admin</a>
            <div class="nav-icons">
                <a href="/admin/dashboard"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
            </div>
        </div>
    </header>
    <main class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h2>Accounting Reports</h2>
            <button onclick="window.print()" class="btn" style="width: auto;"><i class="fa-solid fa-print"></i> Print / Save as PDF</button>
        </div>
        
        <div class="table-container">
            <table>
                <thead>
                    <tr><th>Order ID</th><th>Date</th><th>Customer</th><th>Country</th><th>Payment</th><th>Status</th><th>Total</th></tr>
                </thead>
                <tbody>
                    {% for o in orders %}
                    <tr>
                        <td style="font-weight: 700;">#{{ o.id }}</td>
                        <td>{{ o.created_at.strftime('%Y-%m-%d %H:%M') }}</td>
                        <td>{{ o.customer_name }}</td>
                        <td>{{ o.country }}</td>
                        <td style="text-transform: capitalize;">{{ o.payment_method.replace('_', ' ') }}</td>
                        <td><span class="badge bg-{{ o.status.lower() }}">{{ o.status }}</span></td>
                        <td style="font-weight: 700; color: var(--primary);">${{ o.total }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
