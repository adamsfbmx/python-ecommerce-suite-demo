<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <style>
        .variant-row { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 10px; margin-bottom: 10px; align-items: end; }
        .btn-delete { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: 600; transition: 0.2s; height: 42px; }
        .btn-delete:hover { background: #fca5a5; color: #7f1d1d; }
    </style>
</head>
<body>
    <header>
        <div class="header-top">
            <a href="/" class="logo">Store Admin</a>
            <div class="nav-icons">
                <a href="/admin" style="color:var(--primary);"><i class="fa-solid fa-plus"></i> Add Product</a>
                <a href="/admin/categories"><i class="fa-solid fa-tags"></i> Categories</a>
                <a href="/admin/orders"><i class="fa-solid fa-box"></i> Orders</a>
                <a href="/admin/dashboard"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
                <a href="/admin/customers"><i class="fa-solid fa-users"></i> Customers</a>
                <a href="/admin/settings"><i class="fa-solid fa-gear"></i> Settings</a>
                <a href="/logout" style="color:red;"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
            </div>
        </div>
    </header>
    <main class="container" style="max-width: 900px;">
        <h2 style="margin-bottom: 2rem;">Add New Product</h2>
        <form id="formProduct" class="form-container" style="max-width: 100%;">
            <div class="form-group"><label>Product Name</label><input name="name" class="form-control" required></div>
            <div class="form-group"><label>Description</label><textarea name="description" class="form-control"></textarea></div>
            <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div><label>Price ($)</label><input name="price" type="number" step="0.01" class="form-control" required></div>
                <div><label>Stock (total)</label><input name="stock" type="number" class="form-control" required></div>
            </div>
            <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div><label>Category</label><select name="category_id" id="selectCategory" class="form-control" required><option value="">Select...</option></select></div>
                <div>
                    <label>Gender</label>
                    <select name="gender" class="form-control" required>
                        <option value="Men">Men</option><option value="Women">Women</option>
                        <option value="Kids">Kids</option><option value="Unisex">Unisex</option>
                    </select>
                </div>
            </div>
            <div class="form-group"><label>Image</label><input type="file" name="image" accept="image/*" class="form-control"></div>

            <!-- VARIANTES -->
            <div class="form-group">
                <label style="display:flex; justify-content:space-between; align-items:center;">
                    <span>Variants (Size / Color / Stock)</span>
                    <button type="button" onclick="addVariantRow()" class="btn" style="width:auto; padding:6px 12px; font-size:0.8rem;">
                        <i class="fa-solid fa-plus"></i> Add Variant
                    </button>
                </label>
                <div id="variantsContainer">
                    <!-- Las filas se generan por JS -->
                </div>
                <p style="font-size:0.8rem; color:#64748b; margin-top:0.5rem;">
                    If you don't add any variant, a "Standard / Default" variant will be created automatically using the total stock.
                </p>
            </div>

            <button type="submit" class="btn">Save Product</button>
        </form>
        <p id="message" style="text-align:center; color:green; margin-top:1rem;"></p>

        <div class="table-container" style="margin-top: 3rem;">
            <h3 style="padding: 1rem; background: #f8fafc; border-bottom: 1px solid var(--border);">Existing Products</h3>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th style="text-align: right;">Actions</th>
                    </tr>
                </thead>
                <tbody id="productList">
                    <!-- Aquí se cargan los productos dinámicamente -->
                </tbody>
            </table>
        </div>
    </main>

    <script>
        // ----- VARIANTES DINÁMICAS -----
        function addVariantRow(size = 'M', color = '', stock = 1) {
            const container = document.getElementById('variantsContainer');
            const row = document.createElement('div');
            row.className = 'variant-row';
            row.innerHTML = `
                <div>
                    <label style="font-size:0.75rem;">Size</label>
                    <select name="sizes[]" class="form-control">
                        ${['XS','S','M','L','XL','Standard'].map(s =>
                            `<option value="${s}" ${s === size ? 'selected' : ''}>${s}</option>`
                        ).join('')}
                    </select>
                </div>
                <div>
                    <label style="font-size:0.75rem;">Color</label>
                    <input type="text" name="colors[]" class="form-control" value="${color}" placeholder="e.g., Red">
                </div>
                <div>
                    <label style="font-size:0.75rem;">Stock</label>
                    <input type="number" name="stocks[]" class="form-control" value="${stock}" min="0">
                </div>
                <button type="button" class="btn-delete" onclick="this.parentElement.remove()" title="Remove variant">
                    <i class="fa-solid fa-trash"></i>
                </button>
            `;
            container.appendChild(row);
        }

        // Fila inicial al cargar
        document.addEventListener('DOMContentLoaded', () => {
            addVariantRow('M', '', 1);
        });

        // 1. Cargar categorías en el select
        async function loadCategories() { 
            const res = await fetch('/api/categories'); 
            const data = await res.json(); 
            const select = document.getElementById('selectCategory'); 
            data.forEach(cat => { select.innerHTML += `<option value="${cat.id}">${cat.name}</option>`; }); 
        } 

        // 2. Guardar nuevo producto
        document.getElementById('formProduct').onsubmit = async (e) => { 
            e.preventDefault(); 
            const formData = new FormData(e.target); 
            const res = await fetch('/api/products', { method: 'POST', body: formData }); 
            if (res.ok) { 
                document.getElementById('message').innerText = "Product saved!"; 
                e.target.reset(); 
                document.getElementById('variantsContainer').innerHTML = '';
                addVariantRow('M', '', 1);
                loadProducts();
            } else { 
                alert("Error saving product"); 
            } 
        }; 

        // 3. Cargar la lista de productos existentes
        async function loadProducts() {
            try {
                const res = await fetch('/api/products/list');
                const data = await res.json();
                const tbody = document.getElementById('productList');
                tbody.innerHTML = '';
                
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #64748b;">No products yet.</td></tr>';
                    return;
                }

                data.forEach(p => {
                    tbody.innerHTML += `
                        <tr>
                            <td style="font-weight: 700;">#${p.id}</td>
                            <td style="font-weight: 600;">${p.name}</td>
                            <td>$${p.price}</td>
                            <td>${p.stock}</td>
                            <td style="text-align: right;">
                                <a href="/admin/product/edit/${p.id}" class="btn" style="padding: 6px 12px; font-size: 0.8rem; background: #2563eb; color: white; display: inline-block; margin-right: 5px;">Edit</a>
                                <button onclick="deleteProduct(${p.id})" class="btn-delete">
                                    <i class="fa-solid fa-trash"></i> Delete
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } catch (e) {
                console.error("Error loading products:", e);
            }
        }

        // 4. Eliminar un producto
        async function deleteProduct(id) {
            if (!confirm("Are you sure you want to delete this product? This action cannot be undone.")) return;
            const res = await fetch(`/api/products/delete/${id}`, { method: 'DELETE' });
            if (res.ok) {
                loadProducts();
            } else {
                alert("Error deleting product.");
            }
        }

        // Iniciar
        loadCategories();
        loadProducts();
    </script>
</body>
</html>
