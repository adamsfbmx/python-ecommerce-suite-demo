<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Register - Store</title><link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}"></head><body>
<div class="form-container" style="margin-top: 5rem;">
    <h2 style="text-align: center; margin-bottom: 2rem;">Create Account</h2>
    {% if error %}<p style="color:red; text-align:center;">{{ error }}</p>{% endif %}
    <form method="POST">
        <div class="form-group"><label>Name</label><input type="text" name="name" class="form-control" required></div>
        <div class="form-group"><label>Email</label><input type="email" name="email" class="form-control" required></div>
        <div class="form-group"><label>Password</label><input type="password" name="password" class="form-control" required></div>
        <button type="submit" class="btn">Register</button>
    </form>
    <p style="text-align:center; margin-top:1rem;">Already have an account? <a href="/customer/login">Login</a></p>
</div>
</body></html>
