<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Product - Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <style>
        .current-image-preview {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
            padding: 0.75rem;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }
        .current-image-preview img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 6px;
            background: #e5e7eb;
        }
        .current-image-preview span {
            font-size: 0.85rem;
            color: #64748b;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-top">
            <a href="/" class="logo">Store Admin</a>
            <div class="nav-icons"><a href="/admin">← Back to Admin</a></div>
        </div>
    </header>
    <main class="container" style="max-width: 700px;">
        <h2 style="margin-bottom: 2rem;">Edit Product</h2>
        <form method="POST" enctype="multipart/form-data" class="form-container" style="max-width: 100%;">
            <div class="form-group"><label>Product Name</label><input name="name" class="form-control" value="{{ product.name }}" required></div>
            <div class="form-group"><label>Description</label><textarea name="description" class="form-control">{{ product.description }}</textarea></div>
            <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div><label>Price ($)</label><input name="price" type="number" step="0.01" class="form-control" value="{{ product.price }}" required></div>
                <div><label>Stock</label><input name="stock" type="number" class="form-control" value="{{ product.stock }}" required></div>
            </div>
            <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div>
                    <label>Category</label>
                    <select name="category_id" class="form-control" required>
                        {% for cat in categories %}
                        <option value="{{ cat.id }}" {% if cat.id == product.category_id %}selected{% endif %}>{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label>Gender</label>
                    <select name="gender" class="form-control" required>
                        <option value="Men" {% if product.gender == 'Men' %}selected{% endif %}>Men</option>
                        <option value="Women" {% if product.gender == 'Women' %}selected{% endif %}>Women</option>
                        <option value="Kids" {% if product.gender == 'Kids' %}selected{% endif %}>Kids</option>
                        <option value="Unisex" {% if product.gender == 'Unisex' %}selected{% endif %}>Unisex</option>
                    </select>
                </div>
            </div>

            <!-- IMAGEN DEL PRODUCTO -->
            <div class="form-group">
                <label>Product Image</label>
                {% if product.image and product.image != 'no_image.jpg' %}
                <div class="current-image-preview">
                    <img src="{{ url_for('static', filename='uploads/' + product.image) }}" alt="{{ product.name }}">
                    <span>Current image. Upload a new one below to replace it.</span>
                </div>
                {% else %}
                <div class="current-image-preview">
                    <span>No image set. Upload one below.</span>
                </div>
                {% endif %}
                <input type="file" name="image" accept="image/*" class="form-control">
            </div>

            <button type="submit" class="btn">Save Changes</button>
        </form>
    </main>
</body>
</html>
