<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Forgot Password</title><link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}"></head><body>
<div class="form-container" style="margin-top: 5rem;">
    <h2 style="text-align: center; margin-bottom: 2rem;">Reset Password</h2>
    {% if message %}<p style="color:green; text-align:center;">{{ message }}</p>{% endif %}
    <form method="POST">
        <div class="form-group"><label>Enter your email address</label><input type="email" name="email" class="form-control" required></div>
        <button type="submit" class="btn">Send Reset Link</button>
    </form>
    <p style="text-align:center; margin-top:1rem;"><a href="/customer/login">Back to Login</a></p>
</div>
</body></html>
